spring:
  application:
    name: ledgerlens-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlens
    username: ledgerlens
    password: ledgerlens
  jpa:
    open-in-view: false
    hibernate:
      # O schema é gerenciado pelo Flyway; o Hibernate apenas valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

ledgerlens:
  retention-hours: 24
  cleanup-interval-ms: 3600000
  reconciliation:
    date-tolerance-days: 3
    amount-tolerance: 0.01
    minimum-description-similarity: 0.6
