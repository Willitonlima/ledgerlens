# Blueprint da API Spring Boot. Crie o banco Supabase separadamente e configure
# as variáveis sync:false no Render antes do primeiro deploy.
services:
  - type: web
    name: ledgerlens-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: ALLOWED_ORIGINS
        sync: false
